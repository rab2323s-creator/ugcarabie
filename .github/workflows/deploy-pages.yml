name: Deploy UGC Arabie to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Keep published creator pages and campaign listings up to date.
    - cron: '23 4,16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site for ugcarabie.com
        env:
          VITE_SUPABASE_URL: 'https://nnhcnkatljjpjnxupltq.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_9XoNMg-ZUM7rGpmIcU_7BA_nONo7UeI'
        run: npm run build
      - name: Verify generated SEO index and route pages
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/creators/index.html
          test -f dist/campaigns/index.html
          test -f dist/login/index.html
          test -f dist/for-brands/index.html
          test -f dist/for-creators/index.html
          test -f dist/what-is-ugc/index.html
          grep -q 'توظيف صانع محتوى UGC عربي' dist/for-brands/index.html
          grep -q 'فرص عمل UGC للمبدعين العرب' dist/for-creators/index.html
          grep -q 'ما هو UGC' dist/what-is-ugc/index.html
          grep -q 'https://ugcarabie.com/for-brands/' dist/sitemap.xml
          grep -q 'https://ugcarabie.com/for-creators/' dist/sitemap.xml
          grep -q 'https://ugcarabie.com/what-is-ugc/' dist/sitemap.xml
          grep -q 'rel="canonical"' dist/creators/index.html
          grep -q 'name="robots" content="noindex' dist/login/index.html
          test -f dist/terms/index.html
          test -f dist/privacy/index.html
          grep -q 'Viva Media Creative' dist/terms/index.html
          grep -q 'Viva Media Creative' dist/privacy/index.html
          grep -q 'الملكية الفكرية' dist/terms/index.html
          grep -q 'Supabase' dist/privacy/index.html
          grep -q 'name="robots" content="noindex' dist/terms/index.html
          grep -q 'name="robots" content="noindex' dist/privacy/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Name this attempt's Pages artifact
        id: artifact-name
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: ${{ steps.artifact-name.outputs.name }}

  deploy:
    # Waiting for the build job to complete avoids an immediate artifact lookup race.
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact_name }}

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Verify published site on desktop and mobile
        run: node scripts/check-live.mjs "https://ugcarabie.com/"
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ugcarabie-browser-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: screenshots/
          if-no-files-found: ignore
